name: Release MiraRTP v0.1.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: gradle clean build

      - name: Verify JAR
        run: test -f build/libs/MiraRTP-0.1.0.jar

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "Release v0.1.0 already exists"
          else
            gh release create v0.1.0 build/libs/MiraRTP-0.1.0.jar \
              --title "MiraRTP v0.1.0" \
              --notes "Initial MiraRTP release with cross-world random teleport, safe-location checks, world-border support, cooldowns and optional MiraFactions wilderness filtering."
          fi
