name: MiraRTP
version: 0.1.1
main: com.mira.rtp.MiraRtpPlugin
api-version: '1.21'
author: FiveSOCE
description: Safe async wilderness random teleport for the Mira ecosystem.
depend: [MiraCore, MiraFactions]
softdepend: [Multiverse-Core, MiraCosmetics]
commands:
  rtp:
    description: Randomly teleport to the configured gameplay world.
    usage: /rtp [status|reload]
    permission: mirartp.use
permissions:
  mirartp.use:
    description: Allows use of /rtp.
    default: true
  mirartp.bypass.cooldown:
    description: Bypasses the RTP cooldown.
    default: op
  mirartp.admin:
    description: Allows /rtp reload.
    default: op
